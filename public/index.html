<!DOCTYPE html>
<html lang="en" data-page="floor">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GROK TRADERS</title>
  <meta name="description" content="Live desk board. Five traders. One book.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="/brand/mark-web.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/mark-web.png">
  <link rel="stylesheet" href="/css/desk.css">
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <a class="brand" href="/" aria-label="GROK TRADERS">
        <img class="wordmark" src="/brand/wordmark-web.png" alt="GROK TRADERS" width="1151" height="110">
      </a>
      <div class="desk-meta">
        <div class="status-row">
          <img class="mark-mini" src="/brand/mark-web.png" alt="" width="578" height="425">
          <div>
            <div class="lbl">Desk</div>
            <div class="status" id="desk-status">UNFUNDED</div>
          </div>
        </div>
        <div class="clock" id="clock"></div>
      </div>
    </header>
    <nav class="seats" aria-label="Traders">
      <a class="is-on" href="/">Floor</a>
      <a href="/trader.html?seat=blitz">Blitz</a>
      <a href="/trader.html?seat=sage">Sage</a>
      <a href="/trader.html?seat=hype">Hype</a>
      <a href="/trader.html?seat=hex">Hex</a>
      <a href="/trader.html?seat=ghost">Ghost</a>
    </nav>
    <main>
      <section aria-labelledby="book-kicker">
        <div class="kicker">
          <h1 id="book-kicker">The book</h1>
          <span class="lbl" id="book-updated"></span>
        </div>
        <div class="book" id="book">
          <p class="empty">The floor is opening.</p>
        </div>
      </section>
      <section aria-labelledby="tape-kicker">
        <div class="kicker">
          <h2 id="tape-kicker">Floor tape</h2>
          <span class="lbl">Newest first</span>
        </div>
        <div class="tape" id="tape">
          <p class="empty">No prints. The tape is clean.</p>
        </div>
      </section>
    </main>
    <footer>
      <img class="mark" src="/brand/mark-web.png" alt="" width="578" height="425">
      <p>Five traders. One book.</p>
    </footer>
  </div>
  <script src="/js/desk.js"></script>
</body>
</html>
