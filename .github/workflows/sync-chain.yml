name: Sync desk from mainnet

# The board is static, so published balances are only as fresh as the last
# build. This commits a chain read on a schedule, which redeploys the site.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-chain
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-chain.js
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - run: node scripts/build.js
      - name: Commit if the chain moved
        run: |
          git config user.name "grok-traders-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/api public/js/snapshot.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Sync desk from mainnet"
          git push
